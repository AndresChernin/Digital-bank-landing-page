<!DOCTYPE html>
<html lang="en" >
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital bank landing page</title>
    <link rel="stylesheet" href="/src/styles/styles-for-upper-digitalbank-container.css"> 
    <link rel="stylesheet" href="/src/styles/styles-for-lower-digitalbank-container.css">
    <link rel="stylesheet" href="/src/styles/styles-for-main-container.css">
    <link rel="stylesheet" href="/src/styles/styles-for-foto-part-container.css">
    <link rel="stylesheet" href="/src/styles/styles-for-why-choose-container.css">
    <link rel="stylesheet" href="/src/styles/styles-for-articles-container.css">
     
  
    
   
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;700;900&display=swap"
 rel="stylesheet">
    
  </head>
  <body>
    
    <div id="root"></div>
    
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    
    
    <script src="/src/components/UpperDigitalBank.jsx" type="text/babel"></script>
    <script src="/src/components/FotoComponent.jsx" type="text/babel"></script>
    
    <script src="/src/components/WhyChooseComponent.jsx" type="text/babel"></script>
    <script src="/src/components/WhyChooseSection.jsx" type="text/babel"></script>
    <script src="/src/components/ArticleComponent.jsx" type="text/babel"></script>
    <script src="/src/components/ArticlesSection.jsx" type="text/babel"></script>
    <script src="/src/components/LowerDigitalBank.jsx" type="text/babel"></script>
    
    <script src="/src/data/bankData.js"></script>
    <script src="/src/data/articlesData.js"></script>
   
    <script type="text/babel">
      


       function App(){

        return(
          <main className={"main-container"} >
           <UpperDigitalBank logo_link="./images/logo-dark.svg"
                             icon_link1="./images/icon-hamburger.svg"
                             icon_link2="./images/icon-close.svg"/> 
          <FotoComponent background_foto_mobile="./images/bg-intro-mobile.svg"
                         background_foto_desktop="./images/bg-intro-desktop.svg"
                         inner_foto_link="./images/image-mockups.png"/> 
          <WhyChooseSection data={bankData}/>
          <ArticlesSection data={articlesData}/>
          <LowerDigitalBank logo_link="./images/logo-light.svg"
                            icon1="./images/icon-facebook.svg"
                            icon2="./images/icon-youtube.svg"
                            icon3="./images/icon-twitter.svg" 
                            icon4="./images/icon-pinterest.svg"
                            icon5="./images/icon-instagram.svg" />  
          </main>
         )      
         
       }
      const container = document.querySelector('#root');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
